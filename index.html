<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gopa Gym · Membership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&display=swap"

    />

  <body class="bg-base text-text font-sans antialiased">

      // Terapkan tema sebelum render agar tidak ada kedipan saat halaman dimuat.

        var t = localStorage.getItem('gopa-gym-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
